<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI for Small Business — Rahim Daya</title>
<style>
  @font-face { font-family: "Space Grotesk"; src: url("SpaceGrotesk.woff2") format("woff2"); font-weight: 300 700; }
  @font-face { font-family: "Inter"; src: url("Inter.woff2") format("woff2"); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #05070f; color: #e8ecf8; font-family: "Inter", system-ui, sans-serif; overflow: hidden; }
  .app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  .stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  video { position: absolute; max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: contain; background: #0b1020; opacity: 0; transition: opacity 0.15s; }
  video.on { opacity: 1; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: linear-gradient(180deg, rgba(5, 7, 15, 0), rgba(5, 7, 15, 0.85)); font-size: 13px; opacity: 0; transition: opacity 0.4s; }
  .app.awake .bar { opacity: 1; }
  .app:not(.awake) .bar { pointer-events: none; }
  .bar button { background: rgba(24, 32, 68, 0.8); color: #e8ecf8; border: 1px solid #34407a; border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
  .app:not(.awake) { cursor: none; }
  .bar button:hover { border-color: #22d3ee; }
  .count { font-family: "Space Grotesk", sans-serif; font-weight: 700; min-width: 64px; text-align: center; }
  .spacer { flex: 1; }
  .help { color: #6b76a3; font-size: 12px; }
  .notes { flex: none; max-height: 30vh; overflow: auto; padding: 14px 20px; background: #0f1530; border-top: 1px solid #26305a; font-size: 16px; line-height: 1.5; color: #c9d1ea; }
  .notes b { color: #22d3ee; font-family: "Space Grotesk", sans-serif; }
  .progress { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: rgba(18, 25, 53, 0.6); }
  .progress i { display: block; height: 100%; background: #22d3ee; width: 0; transition: width 0.2s; }
  .tap { position: absolute; top: 0; bottom: 0; width: 30%; cursor: pointer; }
  .tap.l { left: 0; } .tap.r { right: 0; }
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage"><div class="tap l" id="tapL" title="Previous"></div><div class="tap r" id="tapR" title="Next"></div>
  <div class="progress"><i id="prog"></i></div>
  <div class="bar" id="bar">
    <button id="prev" aria-label="Previous slide">◀</button>
    <span class="count" id="count"></span>
    <button id="next" aria-label="Next slide">▶</button>
    <span class="spacer"></span>
    <button id="replay">Replay</button>
    <button id="ntog">Notes</button>
    <button id="fs">Fullscreen</button>
    <span class="help">← → navigate · N notes · F fullscreen</span>
  </div>
  </div>
  <div class="notes" id="notes" hidden></div>
</div>
<script>
  const SLIDES = [
 {
  "label": "Title",
  "src": "clips/s01-title.mp4?v=c0eec2ce",
  "notes": "~0:30. (The robot animation loops while you wait to start.) Welcome. I'm Rahim. No jargon today: two everyday jobs every small business has, done with AI. Everything you'll see is a recording, so no live-demo surprises. The promise is on the slide: run the business, let AI do the admin.",
  "loopFrom": 8
 },
 {
  "label": "You do the admin",
  "src": "clips/s02a-you-do-the-admin.mp4?v=e5ee26be",
  "notes": "~0:25. When you run a small business, you run the business AND you do the admin. Point at the pile: quotes, invoices, receipts, a parking ticket. The bar: your evening disappearing into admin, 6 PM to nearly midnight."
 },
 {
  "label": "AI does the admin",
  "src": "clips/s02b-ai-does-the-admin.mp4?v=c96f04cb",
  "notes": "~0:25. Today's idea: you run the business, AI does the admin. It drafts, sorts and flags. The bar shrinks back: you get your evening back."
 },
 {
  "label": "Crescent Town Events",
  "src": "clips/s03-company.mp4?v=f35f86b1",
  "notes": "~0:35. Our fictional example: a one-person event planner in Scarborough. Quotes, invoices and receipts are done by hand, after hours. Two jobs today: quoting a new client, and taming the paperwork pile."
 },
 {
  "label": "Clip 1: The meeting",
  "src": "clips/s04-meeting.mp4?v=518f9aba",
  "notes": "~0:45 (clip 42s). Point out the toggle: I'm recording this meeting to share with my AI. Meeting with Aliya at Taylor Creek Dental about a holiday party. Read a bubble or two aloud. The counter climbs to 13 details; one really matters, the nut allergy. Quote due Friday."
 },
 {
  "label": "Clip 2: Round 1 in ChatGPT",
  "src": "clips/s07-round1.mp4?v=331a5f40",
  "notes": "~0:40 (clip 36s). Most people type notes from their recording or notepad, add one line, and hope. Here's ChatGPT with typed notes and one line. Looks fine at a glance, until you read it: no prices, the nut allergy is gone, 45 guests ignored, venue rental missing. Looks amateur. Can't send it."
 },
 {
  "label": "Don't type, ramble",
  "src": "clips/s05a-ramble-intro.mp4?v=2692263f",
  "notes": "~0:15. Uh-oh: I forgot to record the meeting! Better get my notes down fast. First trick: don't type, ramble. AI will organize the information for you. Click when ready: the read-along starts immediately."
 },
 {
  "label": "Clip 3: The ramble (read along)",
  "src": "clips/s05-ramble.mp4?v=1c76be8f",
  "notes": "~1:00 (clip 58s). Read aloud as the words light up (~200 words per minute). Cyan = facts, amber = things still to confirm. The text stays on screen if you read slower."
 },
 {
  "label": "Treat AI like a new hire",
  "src": "clips/s08-new-hire.mp4?v=d23aad4a",
  "notes": "~0:35. A new employee wouldn't know your prices on day one. Give AI context about your business: your rate sheet, a past quote and the voice memo, and tell it what to check. Point at the privacy flag: if you don't want your files used for training, turn off 'Help improve Claude' or 'Improve the model for everyone' in Settings."
 },
 {
  "label": "Clip 4: Round 2 in ChatGPT",
  "src": "clips/s09-round2.mp4?v=81fbbdbe",
  "notes": "~1:00 (clip 55s). Step 1: share the voice memo from your phone to your computer; it lands in Downloads. Step 2: in ChatGPT click +, Add photos & files, pick the memo, rate sheet and past quote. ChatGPT transcribes the memo and builds the quote in MY format: nut-free menu, dessert bar, both music options. DJ $7,661.40, playlist $7,039.90. (Note: Claude's chat can't take audio files; ChatGPT can.)"
 },
 {
  "label": "Please confirm before sending",
  "src": "clips/s09b-confirm-list.mp4?v=6b15bbb3",
  "notes": "~0:25. AI flagged what it couldn't know: venue availability (rental billed separately), 40 vs 45 guests (+$339), how serious the allergy is, DJ or playlist. Walk through them, then click."
 },
 {
  "label": "Approved",
  "src": "clips/s09c-confirm-approved.mp4?v=17e02de2",
  "notes": "~0:10. Each item ticked, then APPROVED. Now it can go to Aliya."
 },
 {
  "label": "What AI caught (quote)",
  "src": "clips/s10-quote-caught.mp4?v=fda93ec2",
  "notes": "~0:30. Catch every little detail: the six catches, in my format, at my prices, ready for me to review."
 },
 {
  "label": "Intermediate tip: make it a skill",
  "src": "clips/s10b-tip-skill.mp4?v=d79f1e0c",
  "notes": "~0:45 (clip 37s). Intermediate tip: once a chat works, ask ChatGPT to turn it into a skill. It saves the steps: transcribe, price with my rate sheet, match my format, both music options, flag what to confirm. Install it once. Next week, new client: say 'use my event quote skill', it asks for the voice memo, you attach it, and the quote comes back."
 },
 {
  "label": "The paperwork pile",
  "src": "clips/s11-paperwork.mp4?v=572a3cfa",
  "notes": "~0:25. Job 2. It starts with one invoice. Plus receipts. Plus bills. Plus more invoices. Every business has a folder like this. Who has a shoebox like this?"
 },
 {
  "label": "Clip 5: Snap and share to the folder",
  "src": "clips/s12a-snap-and-share.mp4?v=c735c4fb",
  "notes": "~0:35 (clip 28s). Step 1: snap it, don't scan it; crooked photos in any lighting are fine. Step 2: select the photos, tap Share, Save to Files, and pick the To organize folder; on your Mac they land next to the badly named PDFs already there. Click when ready for step 3."
 },
 {
  "label": "Clip 6: Ask ChatGPT to organize the folder",
  "src": "clips/s12b-ask-chatgpt.mp4?v=243d3896",
  "notes": "~0:20 (clip 20s). Step 3: give ChatGPT the To organize folder with clear instructions: a table of every document, consistent file names, folders by year, month and type, and an action list."
 },
 {
  "label": "Results: the table",
  "src": "clips/s13a-results-table.mp4?v=b1e43336",
  "notes": "~0:25. A clean table of all 10 documents, read from PDFs and photos. Note the duplicate row in amber."
 },
 {
  "label": "Results: renamed and sorted",
  "src": "clips/s13b-results-renamed.mp4?v=a30d0550",
  "notes": "~0:20. On your Mac: the To organize folder is now empty, and every file is renamed (date, vendor, amount) inside Paperwork, sorted into year, month and type folders."
 },
 {
  "label": "Results: action list",
  "src": "clips/s13c-results-actions.mp4?v=1b433672",
  "notes": "~0:40. Back in ChatGPT: helium tank back by Oct 28 or $60 (from the faded print), florist + parking due Oct 30, Maple Mobile Nov 3, East York Family Dental owes $1,733.42, the florist invoice is in there twice. Then it offers to act: draft a payment reminder, add due dates to your calendar, remind you about the helium tank."
 },
 {
  "label": "What AI caught (paperwork)",
  "src": "clips/s14-paper-caught.mp4?v=87f52bf1",
  "notes": "~0:30. $421.49 not paid twice. $1,733.42 to collect. $60 fee avoided. Three due dates. You still check every line."
 },
 {
  "label": "Intermediate tip: put it on a schedule",
  "src": "clips/s14b-tip-schedule.mp4?v=1290399b",
  "notes": "~0:40 (clip 34s). Intermediate tip: in the ChatGPT desktop app, Scheduled, New task. Name it, give it the instructions once, point it at the To organize folder, set every weekday at 8 AM. From then on it checks the folder every morning, files anything new and tells you what's due, with no new prompts. Your computer needs to be on with the app running."
 },
 {
  "label": "Three habits",
  "src": "clips/s15-habits.mp4?v=c1fbd9ae",
  "notes": "~0:50. 1) Give it what you already have: PDFs, Word docs, phone photos, voice memos. 2) Treat AI like an employee: tell it what to do, not how to do it. 3) Ask AI if it has any questions; it will tell you what's confusing."
 },
 {
  "label": "You're the editor-in-chief",
  "src": "clips/s16-editor.mp4?v=89aaf35f",
  "notes": "~0:40. Always review before it reaches a client. Only hand off work you can judge. 'Good enough' usually isn't; take one more pass."
 },
 {
  "label": "Try this Monday",
  "src": "clips/s17-monday.mp4?v=66a497d7",
  "notes": "~0:30. Three prompts to try Monday: quotes, paperwork, emails. Pick one, attach your real files, review what comes back. Each card shows the intermediate next step: make it a skill, or put it on a schedule."
 },
 {
  "label": "Thank you + Questions",
  "src": "clips/s18-thanks.mp4?v=63842019",
  "notes": "~0:15, then Q&A (10 min). Thank you for spending your Sunday here, and for taking the leap to try AI. Questions?",
  "loopFrom": 4
 }
];
  const stage = document.getElementById("stage");
  const vids = SLIDES.map((s) => {
    const v = document.createElement("video");
    v.muted = true; v.playsInline = true; v.preload = "none";
    v.dataset.src = s.src;
    if (s.loopFrom != null) v.addEventListener("ended", () => { if (v === vids[cur]) { v.currentTime = s.loopFrom; v.play().catch(() => {}); } });
    stage.insertBefore(v, stage.firstChild);
    return v;
  });
  function ensure(i) { const v = vids[i]; if (v && !v.getAttribute("src")) { v.src = v.dataset.src; v.preload = "auto"; v.load(); } }
  let cur = -1;
  function go(i) {
    i = Math.max(0, Math.min(SLIDES.length - 1, i));
    if (i === cur) return;
    if (cur >= 0) { vids[cur].pause(); vids[cur].classList.remove("on"); }
    cur = i;
    // load only this clip and its neighbours; release the rest so downloads never queue up
    vids.forEach((v, j) => { if ((j < i - 1 || j > i + 1) && v.getAttribute("src")) { v.pause(); v.removeAttribute("src"); v.load(); } });
    ensure(i); ensure(i + 1); ensure(i - 1);
    const v = vids[i];
    v.classList.add("on");
    try { v.currentTime = 0; } catch (e) {}
    const p = v.play(); if (p && p.catch) p.catch(() => {});
    document.getElementById("count").textContent = (i + 1) + " / " + SLIDES.length;
    document.getElementById("notes").innerHTML = "<b>" + SLIDES[i].label + "</b> &nbsp; " + SLIDES[i].notes.replace(/[<>&]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));
    document.getElementById("prog").style.width = ((i + 1) / SLIDES.length) * 100 + "%";
    history.replaceState(null, "", "#" + (i + 1));
  }
  const next = () => go(cur + 1), prev = () => go(cur - 1);
  document.getElementById("next").onclick = next;
  document.getElementById("prev").onclick = prev;
  document.getElementById("tapR").onclick = next;
  document.getElementById("tapL").onclick = prev;
  document.getElementById("replay").onclick = () => { const v = vids[cur]; v.currentTime = 0; v.play(); };
  const tn = () => { const n = document.getElementById("notes"); n.hidden = !n.hidden; };
  document.getElementById("ntog").onclick = tn;
  const tf = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); };
  document.getElementById("fs").onclick = tf;
  document.addEventListener("keydown", (e) => {
    if (["ArrowRight", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); next(); }
    else if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); prev(); }
    else if (e.key === "n" || e.key === "N") tn();
    else if (e.key === "f" || e.key === "F") tf();
    else if (e.key === "Home") go(0);
    else if (e.key === "End") go(SLIDES.length - 1);
  });
  // controls appear on mouse/touch activity and fade after 2.5s of stillness
  const app = document.querySelector(".app");
  let idle;
  const wake = () => { app.classList.add("awake"); clearTimeout(idle); idle = setTimeout(() => { if (!document.getElementById("bar").matches(":hover")) app.classList.remove("awake"); }, 2500); };
  ["mousemove", "mousedown", "touchstart"].forEach((ev) => document.addEventListener(ev, wake, { passive: true }));
  wake();
  const start = parseInt(location.hash.slice(1), 10);
  go(Number.isFinite(start) ? start - 1 : 0);
</script>
</body>
</html>
